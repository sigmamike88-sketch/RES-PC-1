<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Respira Flashcards</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫁</text></svg>"
    />
    <style>
      :root {
        --bg: #0a0e14;
        --card: #121821;
        --border: #1f2836;
        --text: #e6edf3;
        --text-dim: #8b949e;
        --accent: #e91e63;
        --accent-2: #7c4dff;
        /* Subject Colors */
        --anatomy: #e91e63;
        --physiology: #ff9800;
        --pathology: #3f51b5;
        --pharmacology: #9c27b0;
        --microbiology: #ffc107;
        --biochemistry: #4caf50;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }
      .header {
        width: 100%;
        max-width: 600px;
        margin-bottom: 20px;
      }
      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text-dim);
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
        transition: all 0.2s ease;
        margin-bottom: 15px;
      }
      .back-btn:hover {
        color: #fff;
        border-color: var(--accent);
        background: #1a2130;
        transform: translateX(-3px);
        box-shadow: 0 4px 12px rgba(233, 30, 99, 0.15);
      }
      .back-btn svg {
        transition: transform 0.2s ease;
      }
      .back-btn:hover svg {
        transform: translateX(-2px);
      }
      h1 {
        font-size: 24px;
        font-weight: 800;
        margin-top: 10px;
      }

      /* Flashcard Area */
      .flashcard-container {
        width: 100%;
        max-width: 600px;
        height: 350px;
        perspective: 1000px;
        margin-bottom: 20px;
      }
      .flashcard {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        cursor: pointer;
      }
      .flashcard.is-flipped {
        transform: rotateY(180deg);
      }
      .flashcard-face {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 30px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }
      /* Top gradient bar */
      .flashcard-face::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        border-radius: 16px 16px 0 0;
      }
      .flashcard-face.back {
        transform: rotateY(180deg);
        background: linear-gradient(
          135deg,
          rgba(233, 30, 99, 0.05),
          rgba(124, 77, 255, 0.05)
        );
      }

      .subject-badge {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
        padding: 4px 12px;
        border-radius: 20px;
        border: 1px solid currentColor;
      }
      .card-label {
        position: absolute;
        top: 55px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 10px;
        font-weight: 800;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .card-content {
        font-size: 20px;
        line-height: 1.6;
        font-weight: 600;
        margin-top: 20px;
      }
      .back .card-content {
        font-size: 18px;
        font-weight: 500;
        color: #c9d1d9;
      }

      /* Controls */
      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-top: 10px;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        padding: 12px 24px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 700;
        transition: all 0.2s;
      }
      button:hover:not(:disabled) {
        border-color: var(--accent);
        background: #1a2130;
      }
      button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      button.primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        border-color: transparent;
        color: #fff;
        box-shadow: 0 4px 14px rgba(233, 30, 99, 0.3);
      }
      button.primary:hover:not(:disabled) {
        box-shadow: 0 6px 20px rgba(233, 30, 99, 0.4);
        transform: translateY(-1px);
      }
      .counter {
        font-size: 13px;
        font-weight: 700;
        color: var(--text-dim);
        min-width: 60px;
        text-align: center;
      }
      .hint {
        margin-top: 15px;
        font-size: 12px;
        color: var(--text-dim);
        text-align: center;
      }

      /* Jump to Question Section */
      .jump-section {
        width: 100%;
        max-width: 600px;
        margin-top: 20px;
      }
      .jump-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .jump-title {
        font-size: 11px;
        font-weight: 800;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .jump-counter {
        font-size: 11px;
        font-weight: 800;
        color: var(--text-dim);
        background: var(--card);
        padding: 2px 8px;
        border-radius: 10px;
        border: 1px solid var(--border);
      }

      .jump-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        max-height: 150px;
        overflow-y: auto;
        padding-right: 5px;
        scrollbar-width: thin;
        scrollbar-color: var(--border) var(--bg);
      }
      .jump-grid::-webkit-scrollbar {
        width: 6px;
      }
      .jump-grid::-webkit-scrollbar-thumb {
        background-color: var(--border);
        border-radius: 10px;
      }

      .jump-btn {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text-dim);
        font-size: 11px;
        font-weight: 700;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: all 0.2s;
        padding: 0;
      }
      .jump-btn:hover {
        border-color: var(--accent);
        color: var(--text);
      }
      .jump-btn.active {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        border-color: transparent;
        color: #fff;
        box-shadow: 0 2px 8px rgba(233, 30, 99, 0.4);
      }

      /* Legend */
      .legend {
        width: 100%;
        max-width: 600px;
        margin-top: 20px;
        padding: 12px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-dim);
      }
      .legend-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <a href="index.html" class="back-btn">← Back to Main Page</a>
      <h1>Respira Flashcards</h1>
    </div>

    <div class="flashcard-container">
      <div class="flashcard" id="flashcard" onclick="flipCard()">
        <div class="flashcard-face front">
          <span class="subject-badge" id="frontSubject">Loading...</span>
          <span class="card-label">Question</span>
          <div class="card-content" id="questionText">Loading...</div>
        </div>
        <div class="flashcard-face back">
          <span class="subject-badge" id="backSubject">Loading...</span>
          <span class="card-label">Answer</span>
          <div class="card-content" id="answerText">Loading...</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="prevBtn" onclick="prevCard()">← Prev</button>
      <div class="counter" id="counter">1 / 1</div>
      <button id="nextBtn" class="primary" onclick="nextCard()">Next →</button>
    </div>

    <div class="hint">Click the card to flip it · Use ← → keys to navigate</div>

    <!-- Jump to Question Section -->
    <div class="jump-section">
      <div class="jump-header">
        <span class="jump-title">Jump to Question</span>
        <span class="jump-counter" id="totalCount">0</span>
      </div>
      <div class="jump-grid" id="jumpGrid">
        <!-- Buttons will be generated here by JavaScript -->
      </div>
    </div>

    <!-- Legend -->
    <div class="legend">
      <div class="legend-item">
        <span class="legend-dot" style="background: var(--anatomy)"></span>
        Anatomy
      </div>
      <div class="legend-item">
        <span class="legend-dot" style="background: var(--physiology)"></span>
        Physiology
      </div>
      <div class="legend-item">
        <span class="legend-dot" style="background: var(--pathology)"></span>
        Pathology
      </div>
      <div class="legend-item">
        <span class="legend-dot" style="background: var(--pharmacology)"></span>
        Pharmacology
      </div>
      <div class="legend-item">
        <span class="legend-dot" style="background: var(--microbiology)"></span>
        Microbiology
      </div>
      <div class="legend-item">
        <span class="legend-dot" style="background: var(--biochemistry)"></span>
        Biochemistry
      </div>
    </div>

    <script>
      // ============================================================
      // YOUR FLASHCARD DATA
      // Format: { subject: "Subject Name", q: "Question", a: "Answer" }
      // Make sure the subject name matches exactly one of these:
      // "Anatomy", "Physiology", "Pathology", "Pharmacology", "Microbiology", "Biochemistry"
      // ============================================================
      const flashcards = [
        // ===== Gross Anatomy — 2014 =====
        {
          subject: "Anatomy",
          q: "What muscles are normally active during quiet inspiration?",
          a: "The diaphragm and external intercostal muscles. The diaphragm provides about 75% of air movement during quiet breathing; internal intercostals are expiratory muscles and do not participate in quiet inspiration.",
        },
        {
          subject: "Anatomy",
          q: "What attaches the lungs to the walls of the thorax?",
          a: "The parietal pleural membrane. Surface tension from the thin pleural fluid layer holds the visceral pleura (and lungs) against the parietal pleura that lines the thoracic wall.",
        },
        {
          subject: "Anatomy",
          q: "Which diaphragmatic hiatus is formed by muscle fibers arising from the right crus?",
          a: "The esophageal hiatus at the T10 level. Its right-crus sling acts as a physiological sphincter that helps prevent gastroesophageal reflux.",
        },
        {
          subject: "Anatomy",
          q: "During phonation, what happens to the true vocal folds and the vestibular folds?",
          a: "True vocal folds adduct and the rima glottidis closes; the vestibular (false) folds stay open. The vestibular folds only close during swallowing or straining, not during normal phonation.",
        },
        {
          subject: "Anatomy",
          q: "Which paranasal sinus drains into the ethmoidal bulla of the middle nasal meatus?",
          a: "The middle ethmoidal air cells. Frontal, maxillary, and anterior ethmoidal sinuses drain into the infundibulum or hiatus semilunaris instead.",
        },
        {
          subject: "Anatomy",
          q: "What is the order of layers a needle passes through when entering the pleural space via an intercostal space?",
          a: "Skin → external intercostal → internal intercostal → innermost intercostal → endothoracic fascia → parietal pleura. The parietal pleura is pierced last.",
        },
        {
          subject: "Anatomy",
          q: "What is the arrangement of bronchopulmonary segments in the inferior lobe of the left lung?",
          a: "Superior, medial basal, anterior basal, lateral basal, and posterior basal segments. The left lung also lacks a middle lobe, unlike the right.",
        },
        {
          subject: "Anatomy",
          q: "Which ribs does the inferior margin of the lung cross at the midclavicular and midaxillary lines during quiet respiration?",
          a: "Rib VI at the midclavicular line and rib VIII at the midaxillary line. This is the '6-8-10' rule (rib X at the scapular line).",
        },
        {
          subject: "Anatomy",
          q: "What does the inferior demifacet of the 4th thoracic vertebra articulate with?",
          a: "The superior articular facet of the 5th rib. The inferior demifacet of a vertebra always articulates with the superior facet of the next rib below.",
        },
        {
          subject: "Anatomy",
          q: "Where is the pharyngeal tonsil located?",
          a: "In the mucosa covering the roof and posterior wall of the nasopharynx. It is also called the adenoid.",
        },
        {
          subject: "Anatomy",
          q: "What structures make up the respiratory zone of the respiratory tract?",
          a: "Respiratory bronchioles, alveolar ducts, alveolar sacs, and alveoli. These are the sites of gas exchange; the conducting zone ends at terminal bronchioles.",
        },
        {
          subject: "Anatomy",
          q: "What is external respiration?",
          a: "The exchange of oxygen and carbon dioxide between air in the alveoli and blood in the pulmonary capillaries.",
        },
        {
          subject: "Anatomy",
          q: "Which structures does the larynx connect with?",
          a: "Superiorly the pharynx (laryngopharynx) and inferiorly the trachea.",
        },
        {
          subject: "Anatomy",
          q: "Which airway structures lack cartilage in their walls?",
          a: "Bronchioles. Their walls are supported by smooth muscle and elastic fibers instead, allowing them to constrict and dilate.",
        },
        {
          subject: "Anatomy",
          q: "What structures make up the upper respiratory tract?",
          a: "The nose, pharynx, and larynx. The lower respiratory tract begins at the trachea and includes bronchi, bronchioles, and alveoli.",
        },
        {
          subject: "Anatomy",
          q: "Which part of the parietal pleura is innervated differently from the rest?",
          a: "The mediastinal pleura (with the central diaphragmatic pleura) is innervated by the phrenic nerve (C3–C5). Pain from this region is referred to the shoulder tip.",
        },
        {
          subject: "Anatomy",
          q: "If a small foreign body enters the trachea, where is it most likely to lodge?",
          a: "The right lower lobar bronchus. The right main bronchus is wider, shorter, and more vertical than the left, creating a straighter path.",
        },
        {
          subject: "Anatomy",
          q: "What are the characteristics of a typical left lung?",
          a: "It has two lobes (superior and inferior), is longer and narrower than the right, and its anterior border has a cardiac notch with a lingula below it.",
        },
        {
          subject: "Anatomy",
          q: "Which structure is most superior at the hilum of the left lung?",
          a: "The pulmonary artery. It arches over the left main bronchus.",
        },
        {
          subject: "Anatomy",
          q: "Which airway structure participates in both air conduction and gas exchange?",
          a: "Respiratory bronchioles. Their walls contain alveoli, so they both conduct air and allow gas exchange.",
        },
        {
          subject: "Anatomy",
          q: "How is the pituitary gland surgically accessed?",
          a: "Via transsphenoidal surgery through the sphenoid bone and sinus. The sphenoid sinus lies directly below the sella turcica.",
        },
        {
          subject: "Anatomy",
          q: "What is the innervation of the diaphragmatic pleura?",
          a: "Dual: the peripheral part is supplied by intercostal nerves, and the central part is supplied by the phrenic nerve (C3–C5).",
        },
        {
          subject: "Anatomy",
          q: "What does a stethoscope placed over the 7th right intercostal space in the midaxillary line overlie?",
          a: "The lower lobe of the right lung. The oblique fissure crosses the 5th rib in the midaxillary line, and the lung's inferior margin is at the 8th rib.",
        },
        {
          subject: "Anatomy",
          q: "Which paranasal sinuses open into the middle meatus?",
          a: "The anterior ethmoidal, frontal, and maxillary sinuses. The middle ethmoidal air cells also drain into the middle meatus via the ethmoidal bulla.",
        },
        {
          subject: "Anatomy",
          q: "What is a flail chest?",
          a: "Two or more contiguous ribs fractured at two or more points, creating a free-floating chest wall segment that moves paradoxically during breathing.",
        },
        {
          subject: "Anatomy",
          q: "During inspiration, why does air flow into the lungs?",
          a: "Because the thoracic cavity volume increases, which decreases intrapulmonary pressure below atmospheric pressure, drawing air in.",
        },
        {
          subject: "Anatomy",
          q: "Which structures are located at the level of the sternal angle?",
          a: "The carinal ridge (tracheal bifurcation), the beginning and end of the aortic arch, and the articulation of rib II with the sternum.",
        },
        {
          subject: "Anatomy",
          q: "What are the characteristics of bronchopulmonary segments?",
          a: "Each is the largest subdivision of a lobe, is supplied by its own segmental bronchus, and is surgically resectable. Pulmonary veins run intersegmentally, not intrasegmentally.",
        },

        // ===== Gross Anatomy — 2016 =====
        {
          subject: "Anatomy",
          q: "What does the superior articular facet of rib 5 articulate with?",
          a: "The inferior costal facet of T4. A typical rib's superior facet articulates with the vertebra above, while its inferior facet articulates with its own vertebra.",
        },
        {
          subject: "Anatomy",
          q: "Which intrinsic laryngeal muscle is NOT an adductor of the vocal cords?",
          a: "The posterior cricoarytenoid. It is the only abductor of the vocal cords; all other intrinsic muscles act as adductors or tensors.",
        },
        {
          subject: "Anatomy",
          q: "What does injury to the left external branch of the superior laryngeal nerve cause?",
          a: "Unilateral loss of pitch elevation and vocal fatigue. The external branch supplies the cricothyroid muscle, which tenses the vocal cords to raise pitch.",
        },
        {
          subject: "Anatomy",
          q: "Which structure at the left lung hilum is most likely to be compressed by a large hilar lymph node?",
          a: "The pulmonary artery. At the left hilum the pulmonary artery is the most superior structure.",
        },
        {
          subject: "Anatomy",
          q: "What is the largest and most commonly infected paranasal sinus?",
          a: "The maxillary sinus. Its drainage ostium is located high on its medial wall, so gravity-dependent drainage is poor and infection is common.",
        },
        {
          subject: "Anatomy",
          q: "Which bronchopulmonary segments belong to the middle lobe of the right lung?",
          a: "The lateral and medial segments. Together they form the middle lobe of the right lung.",
        },
        {
          subject: "Anatomy",
          q: "Which structure leaves the most pronounced groove on the mediastinal surface of the right lung?",
          a: "The azygos vein. It arches over the root of the right lung to empty into the superior vena cava.",
        },
        {
          subject: "Anatomy",
          q: "What neural stimulation causes bronchial gland secretion, bronchial smooth muscle contraction, and pulmonary vasodilation?",
          a: "Parasympathetic stimulation via the vagus nerve. Sympathetic stimulation causes bronchodilation and pulmonary vasoconstriction.",
        },
        {
          subject: "Anatomy",
          q: "What does the central tendon of the diaphragm fuse with?",
          a: "The fibrous pericardium. The central tendon is directly fused superiorly with the pericardium of the heart.",
        },
        {
          subject: "Anatomy",
          q: "What is the course of the intercostal nerves in the chest wall?",
          a: "They run in the costal groove along the inferior border of the rib above, between the internal and innermost intercostal muscles.",
        },
        {
          subject: "Anatomy",
          q: "Which functions are NOT carried out by the paranasal sinuses?",
          a: "Air filtration. Filtration by vibrissae and mucociliary clearance occurs in the nasal cavity proper, not in the sinuses.",
        },
        {
          subject: "Anatomy",
          q: "Which muscles are responsible for normal expiration during quiet breathing?",
          a: "None. Quiet expiration is passive and is driven entirely by elastic recoil of the lungs and chest wall.",
        },
        {
          subject: "Anatomy",
          q: "What structure is located immediately anterior to the right lung hilum?",
          a: "The superior vena cava (and the right phrenic nerve). The SVC descends along the right mediastinum immediately anterior to the right hilum.",
        },
        {
          subject: "Anatomy",
          q: "What are the articular features of a typical rib?",
          a: "The head has superior and inferior facets that articulate with two adjacent vertebral bodies; the tubercle articulates with the transverse process of its own vertebra. The inferior facet is larger and articulates with its own vertebra.",
        },
        {
          subject: "Anatomy",
          q: "What is a pleural effusion?",
          a: "Accumulation of excess fluid in the pleural space. As volume increases, it can compress and collapse the underlying lung.",
        },
        {
          subject: "Anatomy",
          q: "Which structures are NOT found in the posterior mediastinum?",
          a: "The phrenic nerves. They run through the middle mediastinum, embedded in the fibrous pericardium. The posterior mediastinum contains the thoracic aorta, esophagus, thoracic duct, azygos veins, and sympathetic trunks.",
        },
        {
          subject: "Anatomy",
          q: "Where does the trachea bifurcate?",
          a: "At the level of the sternal angle (T4/T5). It divides into the right and left primary bronchi at this level.",
        },
        {
          subject: "Anatomy",
          q: "Which muscle does NOT elevate the ribs?",
          a: "The serratus posterior inferior. It depresses the lower ribs and assists expiration; the external intercostals and serratus posterior superior elevate ribs during inspiration.",
        },

        // ===== Gross Anatomy — 2017 =====
        {
          subject: "Anatomy",
          q: "What is the segmental classification of the lung used for?",
          a: "Anatomical description, surgical planning, and functional analysis. Bronchopulmonary segments are the surgical units of the lung because each has its own bronchus and arterial supply.",
        },
        {
          subject: "Anatomy",
          q: "Which structure is the last purely conducting airway before the respiratory zone begins?",
          a: "The terminal bronchiole. Beyond it, respiratory bronchioles contain alveoli and begin gas exchange.",
        },
        {
          subject: "Anatomy",
          q: "Which artery supplies the supraepiglottic region of the larynx?",
          a: "The superior laryngeal artery. It is a branch of the superior thyroid artery and accompanies the internal laryngeal nerve through the thyrohyoid membrane.",
        },
        {
          subject: "Anatomy",
          q: "What structure lies immediately posterior to the larynx?",
          a: "The esophagus. It continues inferiorly into the posterior mediastinum.",
        },
        {
          subject: "Anatomy",
          q: "What is the motor nerve supply of the diaphragm?",
          a: "The phrenic nerve (C3, C4, C5) only. The phrenic nerve provides all motor innervation to the diaphragm; the esophagus pierces at T10 and the caval opening transmits the right phrenic nerve.",
        },
        {
          subject: "Anatomy",
          q: "What structure does the left recurrent laryngeal nerve loop around?",
          a: "The arch of the aorta. It branches from the vagus in the superior mediastinum and loops under the aortic arch, lateral to the ligamentum arteriosum.",
        },
        {
          subject: "Anatomy",
          q: "Which nerve supplies all intrinsic laryngeal muscles except the cricothyroid?",
          a: "The recurrent laryngeal nerve. It also provides sensory innervation to the larynx below the vocal folds.",
        },
        {
          subject: "Anatomy",
          q: "Where is the inferior border of the parietal pleura in the midaxillary line?",
          a: "At rib 10. This follows the 'Rule of 2s' for pleural reflections: rib 8 at the midclavicular line, rib 10 at the midaxillary line, rib 12 at the scapular line.",
        },
        {
          subject: "Anatomy",
          q: "Which laryngeal muscle stretches and elongates the vocal cords to raise voice pitch?",
          a: "The cricothyroid muscle. It tilts the cricoid and thyroid cartilages to tense the vocal cords, producing higher-pitched sounds.",
        },
        {
          subject: "Anatomy",
          q: "Where does the trachea bifurcate (carina) relative to the vertebral column?",
          a: "At the inferior border of T4. This corresponds anteriorly to the sternal angle of Louis.",
        },
        {
          subject: "Anatomy",
          q: "Which muscle group elevates the larynx during swallowing?",
          a: "The suprahyoid muscles (mylohyoid, geniohyoid, stylohyoid, digastric). The infrahyoid muscles depress the larynx instead.",
        },
        {

          a: "The T (Taut/Tense) state. 2,3-BPG binds to deoxyhemoglobin, stabilizing the T state and reducing oxygen affinity.",
        },
        {
          subject: "Biochemistry",
          q: "Which statement about surfactant proteins is NOT correct?",
          a: "The claim that surfactant proteins make up 90% of surfactant is NOT correct. They make up about 10%; the rest is lipids.",
        },
        {
          subject: "Biochemistry",
          q: "Which statement about stored transfusion blood is NOT correct?",
          a: "The claim that stored blood undergoes a rapid increase in 2,3-BPG during storage is NOT correct. 2,3-BPG is lost over time.",
        },
        {
          subject: "Biochemistry",
          q: "What is the physiological impact of a minor pH drop from 7.4 to 7.2?",
          a: "It increases oxygen unloading efficiency by 11%. Lower pH stabilizes the T state, shifting the curve right.",
        },
      ];

      // ============================================================
      // LOGIC - No need to change this
      // ============================================================
      let currentIndex = 0;

      const flashcardEl = document.getElementById("flashcard");
      const questionEl = document.getElementById("questionText");
      const answerEl = document.getElementById("answerText");
      const counterEl = document.getElementById("counter");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const frontSubjectEl = document.getElementById("frontSubject");
      const backSubjectEl = document.getElementById("backSubject");
      const jumpGrid = document.getElementById("jumpGrid");
      const totalCountEl = document.getElementById("totalCount");

      // Color map for subjects
      const subjectColors = {
        Anatomy: "var(--anatomy)",
        Physiology: "var(--physiology)",
        Pathology: "var(--pathology)",
        Pharmacology: "var(--pharmacology)",
        Microbiology: "var(--microbiology)",
        Biochemistry: "var(--biochemistry)",
      };

      function getSubjectColor(subject) {
        return subjectColors[subject] || "var(--accent)";
      }

      function updateCard() {
        const card = flashcards[currentIndex];
        if (!card) return;

        // Reset flip state
        flashcardEl.classList.remove("is-flipped");

        // Update text
        questionEl.textContent = card.q;
        answerEl.textContent = card.a;

        // Update Subject Badges
        const color = getSubjectColor(card.subject);
        frontSubjectEl.textContent = card.subject || "General";
        frontSubjectEl.style.color = color;
        backSubjectEl.textContent = card.subject || "General";
        backSubjectEl.style.color = color;

        // Update counter
        counterEl.textContent = `${currentIndex + 1} / ${flashcards.length}`;
        totalCountEl.textContent = flashcards.length;

        // Update buttons
        prevBtn.disabled = currentIndex === 0;
        nextBtn.disabled = currentIndex === flashcards.length - 1;

        // Update active state on Jump Grid
        document.querySelectorAll(".jump-btn").forEach((btn, index) => {
          btn.classList.toggle("active", index === currentIndex);
        });
      }

      function flipCard() {
        flashcardEl.classList.toggle("is-flipped");
      }

      function nextCard() {
        if (currentIndex < flashcards.length - 1) {
          currentIndex++;
          updateCard();
        }
      }

      function prevCard() {
        if (currentIndex > 0) {
          currentIndex--;
          updateCard();
        }
      }

      // Build the Jump Grid
      function buildJumpGrid() {
        jumpGrid.innerHTML = "";
        flashcards.forEach((card, index) => {
          const btn = document.createElement("button");
          btn.classList.add("jump-btn");
          btn.textContent = index + 1;
          // Add a subtle colored border based on the subject
          btn.style.borderColor = getSubjectColor(card.subject);
          btn.onclick = () => {
            currentIndex = index;
            updateCard();
          };
          jumpGrid.appendChild(btn);
        });
      }

      // Keyboard shortcuts
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") nextCard();
        if (e.key === "ArrowLeft") prevCard();
        if (e.key === " ") {
          e.preventDefault();
          flipCard();
        }
      });

      // Initialize
      buildJumpGrid();
      updateCard();
    </script>
  </body>
</html>
