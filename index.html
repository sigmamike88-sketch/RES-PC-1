<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Respiratory — Study Notes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫁</text></svg>" />
  <style>
    :root {
      --bg: #0a0e14;
      --bg-2: #10151d;
      --bg-3: #171d28;
      --card: #121821;
      --card-hover: #1a2130;
      --border: #1f2836;
      --border-2: #2b3648;
      --text: #e6edf3;
      --text-dim: #8b949e;
      --text-faint: #5a6472;
      --accent: #00bcd4;
      --accent-2: #7c4dff;
      --radius: 16px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      overscroll-behavior-y: none;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; font-size: inherit; }
    a { color: inherit; text-decoration: none; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 4px; }

    #app { min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 24px; }

    /* ========== TOP BAR ========== */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 18px 10px;
      position: sticky; top: 0; z-index: 20;
      background: linear-gradient(180deg, var(--bg) 75%, transparent);
      backdrop-filter: blur(10px);
    }
    .logo-wrap { display: flex; align-items: center; gap: 11px; }
    .logo-badge {
      width: 38px; height: 38px; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      display: grid; place-items: center;
      font-weight: 800; font-size: 12px; color: #fff;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 14px rgba(124, 77, 255, 0.35);
    }
    .logo-text { font-size: 19px; font-weight: 800; letter-spacing: -0.3px; }
    .logo-sub { font-size: 11px; color: var(--text-dim); font-weight: 500; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--bg-3); border: 1px solid var(--border);
      display: grid; place-items: center; flex-shrink: 0;
      transition: all 0.2s;
    }
    .icon-btn:hover { background: var(--card-hover); border-color: var(--border-2); }

    /* ========== BREADCRUMB ========== */
    .crumbs {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 18px 14px;
      font-size: 12px; font-weight: 600; color: var(--text-dim);
      flex-wrap: wrap;
    }
    .crumb { color: var(--text-dim); transition: color 0.15s; padding: 2px 0; }
    .crumb.link { cursor: pointer; }
    .crumb.link:hover { color: var(--accent); }
    .crumb.current { color: var(--text); font-weight: 700; }
    .crumb-sep { opacity: 0.35; }

    /* ========== HERO ========== */
    .hero {
      margin: 0 18px 20px; padding: 22px 20px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(0, 188, 212, 0.12), rgba(124, 77, 255, 0.12));
      border: 1px solid var(--border);
      position: relative; overflow: hidden;
    }
    .hero::before {
      content: ""; position: absolute; top: -40px; right: -40px;
      width: 160px; height: 160px; border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 188, 212, 0.25), transparent 70%);
      pointer-events: none;
    }
    .hero-title { font-size: 20px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.3px; }
    .hero-sub { font-size: 13px; color: var(--text-dim); line-height: 1.55; }

    /* ========== SECTION TITLE ========== */
    .section-title {
      font-size: 11px; font-weight: 800; color: var(--text-faint);
      text-transform: uppercase; letter-spacing: 1.2px;
      padding: 0 18px 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .section-title .count {
      background: var(--bg-3); color: var(--text-dim);
      padding: 3px 9px; border-radius: 999px;
      font-size: 10px; font-weight: 700;
    }

    /* ========== LIST ========== */
    .list { padding: 0 18px; display: flex; flex-direction: column; gap: 12px; }

    /* ========== COURSE CARD ========== */
    .course-card {
      display: flex; align-items: center; gap: 14px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px;
      text-align: left; width: 100%;
      transition: transform 0.15s, border-color 0.2s, background 0.2s;
      position: relative; overflow: hidden;
    }
    .course-card::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0;
      width: 4px; background: var(--course-color, var(--accent));
      opacity: 0; transition: opacity 0.2s;
    }
    .course-card:hover::before { opacity: 1; }
    .course-card:hover { background: var(--card-hover); border-color: var(--border-2); }
    .course-card:active { transform: scale(0.985); }

    .course-thumb {
      width: 52px; height: 52px; border-radius: 14px;
      display: grid; place-items: center; flex-shrink: 0;
      font-size: 24px;
      background: var(--course-bg, rgba(0, 188, 212, 0.12));
      border: 1px solid var(--course-border, rgba(0, 188, 212, 0.3));
    }
    .course-body { flex: 1; min-width: 0; }
    .course-title { font-size: 16px; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.2px; }
    .course-meta {
      font-size: 12px; color: var(--text-dim);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .course-meta .dot { opacity: 0.4; }
    .course-arrow { color: var(--text-faint); flex-shrink: 0; }

    /* ========== EMPTY STATE ========== */
    .empty-state {
      text-align: center; padding: 60px 24px;
      color: var(--text-dim); font-size: 14px;
    }
    .empty-state .emoji { font-size: 44px; margin-bottom: 14px; display: block; opacity: 0.6; }
    .empty-state .title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .empty-state .desc { font-size: 13px; color: var(--text-dim); max-width: 300px; margin: 0 auto; line-height: 1.6; }

    /* ========== RESPONSIVE ========== */
    @media (min-width: 700px) {
      #app { max-width: 680px; margin: 0 auto; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    /* =====================================================================
       NOTES DATA — RESPIRATORY MODULE
       ===================================================================== */
    const NOTES_DATA = [
      { id: "anatomy-gross",      subject: "Anatomy",       label: "Gross Anatomy",       title: "Gross Anatomy — Notes",       icon: "🫀", color: "#00bcd4", color2: "#7c4dff", file: "Files/Notes/Anatomy/Gross.pdf" },
      { id: "anatomy-embryo",     subject: "Anatomy",       label: "Embryology",          title: "Embryology — Notes",          icon: "🧬", color: "#26c6da", color2: "#7c4dff", file: "Files/Notes/Anatomy/Embryo.pdf" },
      { id: "anatomy-histology",  subject: "Anatomy",       label: "Histology",           title: "Histology — Notes",           icon: "🔬", color: "#00acc1", color2: "#7c4dff", file: "Files/Notes/Anatomy/Histology.pdf" },
      { id: "physio",             subject: "Physiology",    label: "Physiology",          title: "Physiology — Notes",          icon: "💨", color: "#4d9fff", color2: "#7c4dff", file: "Files/Notes/Physio/Physio.pdf" },
      { id: "patho",              subject: "Pathology",     label: "Pathology",           title: "Pathology — Notes",           icon: "🔬", color: "#e91e63", color2: "#7c4dff", file: "Files/Notes/Patho/Pathology.pdf" },
      { id: "micro",              subject: "Microbiology",  label: "Microbiology",        title: "Microbiology — Notes",        icon: "🦠", color: "#f5b800", color2: "#ff6d00", file: "Files/Notes/Micro/Micro.pdf" },
      { id: "pharma",             subject: "Pharmacology",  label: "Pharmacology",        title: "Pharmacology — Notes",        icon: "💊", color: "#9c27b0", color2: "#e91e63", file: "Files/Notes/Pharma/Pharma.pdf" },
      { id: "biochem",            subject: "Biochemistry",  label: "Biochemistry",        title: "Biochemistry — Notes",        icon: "🧬", color: "#00c853", color2: "#00bfa5", file: "Files/Notes/Biochem/Biochem.pdf" },
    ];

    /* =====================================================================
       STATE
       ===================================================================== */
    const state = {
      view: "home", // "home" | "notes"
    };

    /* =====================================================================
       HELPERS
       ===================================================================== */
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    }

    /* =====================================================================
       RENDER
       ===================================================================== */
    function render() {
      if (state.view === "notes") return renderNotes();
      renderHome();
    }

    /* =====================================================================
       HOME VIEW
       ===================================================================== */
    function renderHome() {
      const app = document.getElementById("app");
      app.innerHTML = `
        <header class="topbar">
          <div class="logo-wrap">
            <div class="logo-badge">RS</div>
            <div>
              <div class="logo-text">RESPIRA</div>
              <div class="logo-sub">Respiratory Study Notes</div>
            </div>
          </div>
          <div style="display:flex;gap:8px;">
            <a class="icon-btn" href="https://t.me/+t_UlN4sHt7FkYWQ0" target="_blank" rel="noopener" title="Videos on Telegram" style="text-decoration:none;background:linear-gradient(135deg,#2AABEE,#229ED9);border-color:#2AABEE;color:#fff;box-shadow:0 3px 12px rgba(42,171,238,0.4);">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21.5 3.5L2.5 10.5l5 2 2 6 3.5-4.5 5.5 4 3-14.5z"/></svg>
            </a>
          </div>
        </header>

        <div class="hero">
          <div class="hero-title">Respiratory Module 🫁</div>
          <div class="hero-sub">Full study notes for the Respiratory System module.</div>
        </div>

        <div class="section-title">
          Study Materials
          <span class="count">1</span>
        </div>

        <div class="list">
          <button class="course-card" data-open-notes="1" style="--course-color:#7c4dff;--course-color-2:#4d9fff;--course-bg:rgba(124,77,255,0.12);--course-border:rgba(124,77,255,0.3);">
            <div class="course-thumb" style="background:rgba(124,77,255,0.12);border-color:rgba(124,77,255,0.3);">📝</div>
            <div class="course-body">
              <div class="course-title">Open Notes</div>
              <div class="course-meta">${NOTES_DATA.length} notes across ${[...new Set(NOTES_DATA.map((n) => n.subject))].length} subjects</div>
            </div>
            <svg class="course-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>
      `;

      document.querySelector("[data-open-notes]").addEventListener("click", () => {
        state.view = "notes";
        render();
        window.scrollTo(0, 0);
      });
    }

    /* =====================================================================
       NOTES VIEW — list of all note files
       ===================================================================== */
    function renderNotes() {
      const app = document.getElementById("app");
      const subjects = [...new Set(NOTES_DATA.map((n) => n.subject))];

      app.innerHTML = `
        <header class="topbar">
          <div class="logo-wrap">
            <button class="icon-btn" id="backBtn" title="Back" style="margin-right: 4px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </button>
            <div class="logo-badge" style="background:linear-gradient(135deg,#7c4dff,#4d9fff);">📝</div>
            <div>
              <div class="logo-text">Notes</div>
              <div class="logo-sub">${NOTES_DATA.length} files · ${subjects.length} subjects</div>
            </div>
          </div>
        </header>

        <div class="crumbs">
          <span class="crumb link" id="crumbHome">Home</span>
          <span class="crumb-sep">›</span>
          <span class="crumb current">Notes</span>
        </div>

        <div class="list">
          ${NOTES_DATA.map((n) => `
            <a class="course-card" href="${escapeHtml(n.file)}" target="_blank" rel="noopener" style="--course-color:${n.color};--course-color-2:${n.color2};--course-bg:rgba(0,0,0,0.2);--course-border:${n.color}40;">
              <div class="course-thumb" style="background:${n.color}22;border-color:${n.color}55;">${n.icon}</div>
              <div class="course-body">
                <div class="course-title">${escapeHtml(n.title)}</div>
                <div class="course-meta">
                  <span style="color:${n.color};font-weight:700;">${escapeHtml(n.subject)}</span>
                  <span class="dot">·</span>
                  <span>${escapeHtml(n.label)}</span>
                </div>
              </div>
              <svg class="course-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>
            </a>
          `).join("")}
        </div>
      `;

      document.getElementById("backBtn").addEventListener("click", goHome);
      document.getElementById("crumbHome").addEventListener("click", goHome);
    }

    function goHome() {
      state.view = "home";
      render();
      window.scrollTo(0, 0);
    }

    /* =====================================================================
       BOOT
       ===================================================================== */
    render();
  </script>
</body>
</html>
